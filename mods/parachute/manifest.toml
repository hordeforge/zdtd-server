# parachute: deployable parachute item (wearable clothing), ADR 0037.
# Fully self-contained: Config/items.xml patch (the item), preset.toml
# (the [authority] glide exemption), config.toml (deploy tuning, served to
# the guest via zdtd.config), parachute.zig/.wasm (the deploy state machine),
# README.md, icon.png.
# Opt-in: [mods] enabled = ["parachute"] in zdtd.toml.

name = "parachute"
version = "0.1.0"
tier = "user"
icon = "icon.png"
wasm = "parachute.wasm"
preset = "preset.toml"
enabled = false
description = "Parachute item (wearable clothing): auto-deploys when falling fast while worn. Deceleration is server-side: the glide flag arms the C2S vertical clamp (sink_vy_mps) and the envelope exemption; fall-damage stays client-owned (stock wire). The stock client needs the patched items.xml to render the item (client modlet install or the paired client mod); without it the item exists server-side only."
