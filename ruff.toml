# Ruff gate for repo Python (tools/*.py, scripts/*.py).
# Wired by `make lint` / CI; versions: whatever `ruff` on PATH reports
# (CI pins 0.16.4 in the "Install ruff" step of .github/workflows/ci.yml).
# Only rule groups the tree
# already passes are selected so the gate is a ratchet, not a mass rewrite.
# Line length is the smallest multiple of 10 the tree already clears (max
# observed line is 557, in the markup block of scripts/gen_provenance.py);
# E501 is selected, so the cap is enforced rather than merely declared; do not
# tighten without reformatting first.

target-version = "py311"
line-length = 560

[lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle: layout (E1/E2/E3/E7) plus E501 against line-length
    "W",   # pycodestyle warnings
    "PLE", # pylint errors (defects, not the opinionated PL refactor rules)
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "RUF", # ruff-specific
    "ERA", # commented-out code
    "PIE", # flake8-pie
    "TRY", # tryceratops
    "ARG", # unused function args
    "DTZ", # flake8-datetimez
    "FA",  # future-annotations
    "LOG", # flake8-logging
    "G",   # flake8-logging-format
    "PGH", # pygrep-hooks
    "C4",  # comprehensions
    "SIM", # flake8-simplify: SIM115 caught 16 leaked file handles in the gate scripts
    "RET", # return-flow (the assignments a bare `return` made redundant)
    "TID", # tidy-imports: no parent-relative imports, so a gate module stays importable
    "ICN", # conventional import aliases
    "Q",   # quotes: the tree is double-quoted throughout
    "RSE", # unused parens
    "SLF", # private member access
    "FBT", # boolean trap
    "ASYNC",
    "S",   # bandit: the security category, previously off entirely
]

[lint.per-file-ignores]
# wire_order_mutants.py:376 branches on args.file to pick the target list, and
# SIM108's one-line ternary for it is longer and less readable than the block.
# It also shells out to `git` / `zig` on purpose, with a literal argument list
# (no shell=True, nothing interpolated from a scanned file). S603 asks for that
# argument list to be re-read by hand; S607 wants an absolute interpreter path,
# which would break on any machine where the toolchain is not at a fixed
# location. Every other S rule stays on for both files.
"tools/wire_order_mutants.py" = ["SIM108", "S603", "S607"]
# Same subprocess rationale as above, for the `git ls-files` call.
"tools/provenance_scan.py" = ["S603", "S607"]
