# SonarQube Cloud configuration (scanned by .github/workflows/build.yml).
# The repo is Zig 0.16; SonarQube has no official Zig language analyzer, so
# this scope covers the analyzers it does support (shell scripts, XML) plus
# repo-level metrics and quality gates. The CI gate in ci.yml / build.yml is
# the real correctness gate (make check).

sonar.projectKey=maci0_zdtd
sonar.organization=maci0

# Name and version displayed in the SonarCloud UI.
sonar.projectName=zdtd

# Paths are relative to this file. Replace "\" by "/" on Windows.
sonar.sources=src,scripts

# Build output, dependency checkouts and generated content are not source.
sonar.exclusions=\
  **/.zig-cache/**,\
  **/zig-out/**,\
  **/zig-pkg/**,\
  **/assets/fixtures/**,\
  **/worlds/**,\
  **/.zdtd_cfg_cache/**

# Encoding of the source code. Default is the default system encoding.
sonar.sourceEncoding=UTF-8
