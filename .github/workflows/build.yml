name: Build

# SonarQube Cloud analysis on the main branch and pull requests. SonarQube
# analyzes what its analyzers support (the repo is Zig 0.16, which SonarQube has
# no official language plugin for, so the analysis covers shell scripts, XML and
# repo-level quality gates rather than Zig source diagnostics). The scan reads
# the source tree only: it needs no build output, no toolchain and no lint
# tools, so the correctness gate (make check) is left to ci.yml, which runs on
# the same events and the same commit. Duplicating it here would cost a second
# full Zig build + test + fuzz on every push and pull request.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube
    # SONAR_TOKEN is not exposed to pull requests from forks, so the scan step
    # would fail there for a reason a contributor cannot fix. Skip instead.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Shallow clones should be disabled for a better relevancy of analysis.
          fetch-depth: 0
          persist-credentials: false

      # Fail closed with a clear message when the repo secret is missing; the
      # scan action otherwise exits with an opaque auth error.
      - name: Require SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SONAR_TOKEN}" ]]; then
            echo "SONAR_TOKEN repository secret is not configured" >&2
            exit 1
          fi

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
