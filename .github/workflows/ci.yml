name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least-privilege token: cache restore/save uses the Actions cache service and
# does not require repository Actions write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a tag build (release artifacts); cancel redundant PR/main runs.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # check-release.sh compares the product version with every existing
          # release tag. A shallow checkout can hide an older v* tag and let a
          # later commit reuse an already-published version.
          fetch-depth: 0
          persist-credentials: false

      # make lint requires these tools; do not rely on runner image contents.
      - name: Install lint tools
        run: |
          set -euo pipefail
          missing=()
          command -v rg >/dev/null 2>&1 || missing+=(ripgrep)
          command -v shellcheck >/dev/null 2>&1 || missing+=(shellcheck)
          if ((${#missing[@]})); then
            export DEBIAN_FRONTEND=noninteractive
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          rg --version
          shellcheck --version

      - name: Read toolchain pin
        id: pin
        run: |
          set -euo pipefail
          zig="$(bash scripts/zig-pin.sh)"
          echo "zig=$zig" >> "$GITHUB_OUTPUT"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          # Single source of truth: .zigversion (also enforced by make release-check).
          version: ${{ steps.pin.outputs.zig }}

      - name: Verify workflow toolchain pin
        run: test "$(zig version)" = "$(bash scripts/zig-pin.sh)"

      # Zig's cache is content-addressed, so restoring a stale entry is safe;
      # keying on github.sha keeps a rolling cache (always save, restore latest
      # for the same compiler) instead of never hitting after any source change.
      - name: Cache Zig build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-cache-${{ runner.os }}-${{ steps.pin.outputs.zig }}-${{ github.sha }}
          restore-keys: |
            zig-cache-${{ runner.os }}-${{ steps.pin.outputs.zig }}-

      - name: Run validation gate
        run: make check

      - name: Build operator binary
        run: make release

      - name: Smoke-test release binary
        run: bash scripts/smoke-release.sh

      - name: Upload release binary
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Tag builds are version-identified (check-release.sh guarantees the
          # tag equals the product version); main builds keep the commit SHA.
          name: zdtd-linux-x86_64-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
          # All paths stay under zig-out/bin so the artifact root (their common
          # ancestor) keeps the flat layout `sha256sum -c zdtd.sha256` expects.
          # LICENSE/THIRD_PARTY.md ride along: the binary statically links
          # Apache-2.0 zwasm, whose section 4(a) requires shipping the text.
          path: |
            zig-out/bin/zdtd
            zig-out/bin/zdtd.sha256
            zig-out/bin/buildinfo.txt
            zig-out/bin/zdtd.cdx.json
            zig-out/bin/LICENSE
            zig-out/bin/THIRD_PARTY.md
            zig-out/bin/zdtd.toml.example
            zig-out/bin/serverconfig.example.xml
            zig-out/bin/assignids_v314.embed.txt
            zig-out/bin/modes
          if-no-files-found: error
          # Keep tag artifacts longer for operators fetching a release build.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 14 }}

  # Release-artifact reproducibility (docs/RELEASES.md step 6): build the
  # release config twice in independent cache trees and require byte-identical
  # binaries. Runs only on tag builds, which are the ones that ship artifacts.
  # Not cached on purpose: both halves must be full builds from the pinned
  # toolchain, so a fresh runner also proves the fetch+pin path works.
  repro:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Keep the release gate's tag-history checks equivalent in both tag
          # jobs instead of relying on checkout's single-ref fetch behavior.
          fetch-depth: 0
          persist-credentials: false

      - name: Read toolchain pin
        id: pin
        run: |
          set -euo pipefail
          zig="$(bash scripts/zig-pin.sh)"
          echo "zig=$zig" >> "$GITHUB_OUTPUT"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.pin.outputs.zig }}

      - name: Verify workflow toolchain pin
        run: test "$(zig version)" = "$(bash scripts/zig-pin.sh)"

      - name: Build twice and compare
        run: make repro
