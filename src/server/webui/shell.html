<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>zdtd - operator console</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>/* zdtd-tokens: paper cockpit. Ground/cards/pills/type from recompile DESIGN.md; the chart + console log are the one TMOG terminal. */
:root{
  color-scheme:light;
  --bg:#f7f5f0;
  --bg2:#efece4;
  --panel:#fffdf8;
  --panel2:#efece4;
  --inset:#efece4;
  --well:#fffdf8;
  --line:#e2ddd0;
  --line2:#cfc8b6;
  --edge:#5f686f;
  --fg:#1a1d21;
  --muted:#4d545c;
  --muted2:#5f686f;
  --acc:#0f5c37;
  --acc-ink:#0c4a2d;
  --acc-soft:#dcefe1;
  --acc-ghost:rgba(15,92,55,.06);
  --acc-ring:rgba(15,92,55,.28);
  --ok:#0f5c37;
  --ok-soft:#dcefe1;
  --warn:#6b4a00;
  --warn-soft:#f2dbaa;
  --err:#8a2318;
  --err-border:#d59f96;
  --err-soft:#f5c9c2;
  --term:#101418;
  --term2:#1a2129;
  --term-line:#2a333d;
  --term-band1:#22303c;
  --term-band2:#2c3f4e;
  --term-text:#d8e2dc;
  --term-faint:#7f8b94;
  --term-key:#ffd8a0;
  --term-ok:#5fd894;
  --term-bad:#ff7364;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --r:10px;
  --r-ctl:9px;
  --shadow:0 1px 2px rgba(26,29,33,.06),0 8px 24px -12px rgba(26,29,33,.18);
}
/* /zdtd-tokens */
*{box-sizing:border-box}
html{scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
body{font-family:var(--sans);margin:0;background:var(--bg);color:var(--fg);line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--acc-ink);text-decoration:underline;text-decoration-color:rgba(15,92,55,.35);text-underline-offset:2px}
a:hover{color:var(--acc-ink)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tab:focus-visible,[role=tabpanel]:focus-visible,#players:focus-visible,#modules:focus-visible{outline-offset:-3px}
pre:focus-visible,#apm-canvas:focus-visible,.chart-tools-right input:focus-visible,.chart-tools-right select:focus-visible{outline-color:var(--term-ok)}
code{font-family:var(--mono);font-size:0.82em;background:var(--bg2);border:1px solid var(--line);padding:0.1em 0.32em;border-radius:6px;color:var(--muted)}
kbd{font-family:var(--mono);font-size:0.78em;line-height:1;background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:0.14em 0.32em;color:var(--muted)}
.skip-link{position:absolute;left:0.75rem;top:-100%;background:var(--fg);color:var(--bg);padding:0.4rem 0.6rem;border-radius:0 0 6px 6px;font-weight:600;font-size:0.85rem;z-index:30;text-decoration:none}
.skip-link:focus{top:0}

header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:0.75rem;min-height:56px;padding:0 1.5rem}
.hdr-left{display:flex;align-items:center;gap:0.6rem;min-width:0}
.mark{width:22px;height:22px;display:grid;place-items:center;background:var(--acc);color:#fff;font-family:var(--mono);font-weight:700;font-size:0.7rem;line-height:1;flex:none;border-radius:6px}
.mark::before{content:">_"}
.word{display:inline;margin:0;font-family:var(--sans);font-size:1.02rem;font-weight:700;letter-spacing:-0.01em;color:var(--fg)}
.ver{font-family:var(--mono);font-size:0.72rem;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26rem}
.glance{margin-left:0.4rem;display:inline-flex;align-items:center;gap:0.4rem;font-family:var(--sans);font-size:0.78rem;font-weight:600;color:var(--muted)}
.glance .lamp{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.glance .lamp.bad{background:var(--err)}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:0.5rem}
.refresh-ctrl{display:inline-flex;align-items:center;gap:0.4rem;color:var(--muted);font-family:var(--sans);font-size:0.85rem;font-weight:500;cursor:pointer;user-select:none;min-height:44px}
.refresh-ctrl input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line2);border:1px solid var(--edge);position:relative;cursor:pointer;flex:none;margin:0}
.refresh-ctrl input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .12s}
.refresh-ctrl input:checked{background:var(--acc);border-color:var(--acc)}
.refresh-ctrl input:checked::after{transform:translateX(14px)}
.btn{appearance:none;min-height:44px;padding:0 1.1rem;border-radius:var(--r-ctl);border:1px solid var(--line2);background:var(--panel);color:var(--fg);font-family:var(--sans);font-size:0.9rem;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--bg2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--acc);border-color:var(--acc-ink);color:#fff}
.btn.primary:hover{background:var(--acc-ink)}
.logout-form{margin:0}
.logout-form .btn{border-color:transparent;color:var(--err);background:transparent;font-weight:500}
.logout-form .btn:hover{background:var(--err-soft)}

#app{display:contents}
.layout{max-width:1080px;margin:0 auto;padding:1.5rem 1.5rem 5.5rem;display:grid;gap:1.25rem;align-content:start}
.page-nav{position:sticky;top:56px;z-index:19;display:flex;gap:0.25rem;background:var(--bg);padding:0;overflow:auto}
.tab{appearance:none;background:transparent;border:0;color:var(--muted);font-family:var(--sans);font-size:0.92rem;font-weight:500;min-height:44px;padding:0.45rem 0.7rem;display:inline-flex;align-items:center;gap:0.45rem;cursor:pointer;white-space:nowrap;border-radius:8px;flex:none}
.tab i{font-style:normal;color:var(--muted2);font-family:var(--mono);font-size:0.72rem;min-width:1.15rem}
.tab:hover{color:var(--fg);background:var(--bg2)}
.tab[aria-selected=true]{color:var(--acc-ink);background:var(--acc-soft);font-weight:600}
.tab[aria-selected=true] i{color:var(--acc-ink)}

main{display:grid;gap:1.25rem;min-width:0;align-content:start}
section{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
section h2{margin:0;font-family:var(--sans);font-size:1.05rem;font-weight:600;letter-spacing:-0.01em;color:var(--fg);padding:1rem 1.25rem 0.35rem}
section h3{margin:0;font-family:var(--sans);font-size:0.9rem;font-weight:600;color:var(--fg);padding:0.9rem 1.25rem 0.3rem}
.deck-sub{margin:0;padding:0 1.25rem 0.6rem;color:var(--muted);font-size:0.85rem}
section > div[id]{padding:0}
#players,#modules{overflow:auto}

table{width:100%;border-collapse:collapse;font-size:0.95rem}
th,td{padding:0.75rem 0.95rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
thead th{color:var(--muted);font-family:var(--sans);font-weight:600;font-size:0.78rem;letter-spacing:0.06em;text-transform:uppercase;background:var(--bg2);white-space:nowrap}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
tbody tr:hover td{background:rgba(15,92,55,.05)}
td{font-family:var(--sans);font-variant-numeric:tabular-nums;color:var(--fg)}
td.num,th.num,td .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:0.88rem}
.num{font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

.pill{display:inline-flex;align-items:center;gap:0.3rem;border:1px solid var(--line2);border-radius:999px;padding:0.22rem 0.6rem;font-family:var(--sans);font-size:0.75rem;font-weight:600;letter-spacing:0.02em;color:var(--muted);background:var(--bg2);white-space:nowrap}
.pill.ok{background:var(--acc-soft);border-color:#9cc6aa;color:var(--acc-ink)}
.pill.bad{background:var(--err-soft);border-color:var(--err-border);color:var(--err)}
.pill.warn{background:var(--warn-soft);border-color:#cbab72;color:var(--warn)}

.glance-band{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin:0}
.glance-cell{padding:0.9rem 1.1rem;border-left:1px solid var(--line);min-width:0}
.glance-cell:first-child{border-left:0}
.glance-cell b{display:block;font-family:var(--sans);font-size:1.7rem;font-weight:700;line-height:1.2;letter-spacing:-0.02em;color:var(--fg);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.glance-cell span{color:var(--muted);font-family:var(--sans);font-size:0.78rem;letter-spacing:0.06em;text-transform:uppercase;font-weight:600}
.glance-cell .pill{margin-top:0.3rem}
.glance-cell .glance-pill{display:inline-flex;margin-top:0.4rem}
.warn-text{color:var(--warn)}

.meter{height:10px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);overflow:hidden;margin-top:0.45rem}
.meter i{display:block;height:100%;border-radius:999px;background:var(--acc);transition:width .5s ease-out}
.meter.hot i{background:var(--err)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0;background:transparent;border-top:1px solid var(--line);margin:0;list-style:none;padding:0}
.stat{padding:0.8rem 1.1rem;min-width:0;border-left:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent}
.stat:first-child{border-left:0}
.stat b{display:block;font-family:var(--sans);font-size:1.25rem;font-weight:700;line-height:1.2;letter-spacing:-0.01em;color:var(--fg);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{color:var(--muted);font-family:var(--sans);font-size:0.72rem;letter-spacing:0.05em;line-height:1.4;text-transform:uppercase;font-weight:600}
.stat .pill{margin-top:0.25rem}

footer{border-top:1px solid var(--line);background:var(--panel)}
.foot{max-width:1080px;margin:0 auto;padding:1rem 1.5rem 2rem;color:var(--muted);font-family:var(--sans);font-size:0.85rem;display:flex;flex-wrap:wrap;gap:0.3rem 0.65rem;align-items:center;min-height:44px}
.foot a{color:var(--muted)}
#refresh-state{color:var(--muted)}

.cmd-row{display:flex;gap:0.5rem;align-items:center;padding:0.9rem 1.25rem;background:var(--panel);border-bottom:1px solid var(--line)}
.cmd-row input[type=text]{flex:1;min-width:10rem;min-height:44px;background:var(--panel);border:1.5px solid var(--edge);color:var(--fg);padding:0.65rem 0.8rem;border-radius:var(--r-ctl);font-family:var(--mono);font-size:0.95rem;width:100%}
.cmd-row input[type=text]::placeholder{color:var(--muted2)}
.cmd-row input[type=text]:hover{border-color:var(--muted2)}
.cmd-row input[type=text]:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
.cmd-row button{background:var(--acc);color:#fff;border:1px solid var(--acc-ink);border-radius:var(--r-ctl);padding:0 1.25rem;min-height:44px;min-width:4.5rem;font-family:var(--sans);font-size:0.9rem;font-weight:600;cursor:pointer}
.cmd-row button:hover{background:var(--acc-ink)}
.cmd-row button:disabled{opacity:.45;cursor:wait}
.cmd-help{margin:0;padding:0.8rem 1.25rem;color:var(--muted);font-size:0.85rem;border-bottom:1px solid var(--line)}
.quick-row{display:flex;flex-wrap:wrap;gap:0.5rem;padding:0.8rem 1.25rem;border-top:1px solid var(--line);background:transparent}
.quick-cmd{background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:999px;padding:0.45rem 0.85rem;min-height:44px;font-family:var(--mono);font-size:0.82rem;font-weight:500;cursor:pointer;white-space:nowrap}
.quick-cmd:hover{color:var(--fg);border-color:var(--edge);background:var(--bg2)}
.mod-btn{background:var(--panel);border:1px solid var(--line2);color:var(--fg);border-radius:var(--r-ctl);padding:0.5rem 0.85rem;min-height:44px;min-width:4.5rem;font-family:var(--sans);font-size:0.85rem;font-weight:600;cursor:pointer;white-space:nowrap}
.mod-btn:hover{background:var(--bg2)}
.deck{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.deck-head{display:flex;align-items:center;gap:0.6rem;background:var(--bg2);padding:0.7rem 1.25rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
.deck-head .job{font-family:var(--mono);font-size:0.8rem;font-weight:600;letter-spacing:0.06em;color:var(--fg);text-transform:uppercase}
.deck-head .meta{margin-left:auto}
.deck-body{padding:1.1rem 1.25rem 1.25rem}
#apm-chart-wrap{background:var(--term);border:1px solid var(--term-line);border-radius:var(--r);box-shadow:var(--shadow);padding:0.9rem 1rem 1rem;margin:0}
.chart-tools{display:flex;align-items:center;justify-content:space-between;gap:0.5rem;margin-bottom:0.5rem;flex-wrap:wrap}
.chart-tools .meta{font-family:var(--mono);font-size:0.72rem;letter-spacing:0.04em;color:var(--term-faint);font-variant-numeric:tabular-nums}
.chart-tools-right{display:inline-flex;align-items:center;gap:0.6rem;flex-wrap:wrap}
.chart-tools .refresh-ctrl{color:var(--term-faint);min-height:44px}
.chart-tools .refresh-ctrl input{background:var(--term-line);border-color:var(--term-line)}
.chart-tools .refresh-ctrl input:checked{background:var(--term-ok);border-color:var(--term-ok)}
#apm-canvas{width:100%;height:11rem;display:block;border-radius:6px;background:var(--term);border:0;touch-action:pan-y;cursor:crosshair}
a,button,input,[tabindex]{scroll-margin-top:6.5rem}
pre.cmd-out,pre.cmd-log{margin:0 1.25rem 1.1rem;background:var(--term);color:var(--term-text);border:1px solid var(--term-line);border-radius:var(--r);padding:0.9rem 1rem;font-family:var(--mono);font-size:0.88rem;line-height:1.7;overflow:auto;max-height:15rem;white-space:pre-wrap;word-break:break-word}
#cmd-out{padding:0}
.err{color:var(--err)} .ok{color:var(--ok)}
pre .in,pre .meta{color:var(--term-faint)} pre.err,pre .err{color:var(--term-bad)} pre.ok,pre .ok{color:var(--term-ok)}
@media(min-width:55rem){#players table{min-width:34rem}#modules table{min-width:34rem}}
.meta{color:var(--muted);font-family:var(--sans);font-size:0.85rem}
.empty-note{color:var(--muted)}
.flush{margin-top:0}
#status .meta,#apm .meta,#players .meta,#console-log .meta{padding:0.8rem}
.noscript{margin:0;padding:0.6rem 1.25rem;background:var(--warn-soft);color:var(--warn);border-bottom:1px solid var(--line);font-family:var(--sans);font-size:0.85rem}
@media(forced-colors:active){:root{--bg:Canvas;--panel:Canvas;--inset:Canvas;--well:Canvas;--bg2:Canvas;--fg:CanvasText;--muted:CanvasText;--muted2:CanvasText;--line:CanvasText;--line2:CanvasText;--edge:CanvasText;--acc:LinkText;--acc-ink:LinkText;--term:Canvas;--term2:Canvas;--term-line:CanvasText;--term-text:CanvasText;--term-faint:CanvasText}body{background:Canvas;color:CanvasText}header,.page-nav,footer,section,.deck,.glance-band{background:Canvas;border-color:CanvasText}.top,.foot{border-color:CanvasText}main{border:0}a{color:LinkText}input,button,select{border:1px solid ButtonText;background:Canvas;color:CanvasText}input::placeholder{color:GrayText}.err{color:Mark;background:MarkText}.ok,.warn-text{color:MarkText}#apm-canvas{border:1px solid CanvasText}.mark{background:CanvasText;color:Canvas}.pill{border:1px solid CanvasText}.meter{border:1px solid CanvasText}pre.cmd-out,pre.cmd-log{background:Canvas;color:CanvasText;border:1px solid CanvasText}}
@media(max-width:55rem){
 header{position:static}
 .top{padding:0.5rem 1rem;flex-wrap:wrap;row-gap:0.25rem}
 .layout{padding:1rem 1rem 4rem}
 .page-nav{position:sticky;top:0;overflow:auto;max-width:100vw}
 header .ver{display:none}
 .glance{margin-left:0}
 .header-actions{margin-left:0;width:100%;justify-content:flex-start}
 main{padding:0}
 .glance-band{grid-template-columns:repeat(2,minmax(0,1fr))}
 .glance-cell:nth-child(3){border-left:0}
 .cmd-row{flex-wrap:wrap}
 .cmd-row input[type=text]{min-width:0}
 .chart-tools .meta{flex:1 1 100%}
 .deck-head .meta{flex:1 1 100%;margin-left:0}
 .chart-tools-right{width:100%;justify-content:flex-start}
 #apm-chart-wrap{padding:0.7rem}
 table.stack thead{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
 table.stack tbody tr{display:block;border-bottom:1px solid var(--line);padding:0.4rem 0}
 table.stack tbody td,table.stack tbody th[scope=row]{display:grid;grid-template-columns:8.5rem minmax(0,1fr);gap:0.5rem;border:0;padding:0.4rem 0.95rem;align-items:baseline;white-space:normal;overflow-wrap:anywhere}
 table.stack tbody td::before,table.stack tbody th[scope=row]::before{content:attr(data-label);font-family:var(--sans);font-size:0.72rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted2)}
  table.stack tbody td[data-label=Action]::before{content:""}
 table.stack tbody td.empty-note{display:block;white-space:normal}
 table.stack tbody td.empty-note::before{content:""}
}
@media(max-width:30rem){
 .header-actions{flex-wrap:wrap}
 .glance-band{grid-template-columns:minmax(0,1fr)}
 .glance-cell{border-left:0;border-bottom:1px solid var(--line)}
 .deck-body{padding:0.75rem}
 .cmd-row{padding:0.75rem}
 .cmd-row input[type=text]{flex-basis:100%}
 table.stack tbody td,table.stack tbody th[scope=row]{grid-template-columns:minmax(0,1fr)}
 .pill{white-space:normal;overflow-wrap:anywhere}
 .deck-sub{overflow-wrap:anywhere}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}html{scroll-behavior:auto}}
#chart-history{min-height:44px;background:var(--term2);border:1px solid var(--term-line);color:var(--term-text);border-radius:var(--r-ctl);padding:0.3rem 0.5rem;font-family:var(--mono);font-size:0.8rem}
.chart-tools .meta{font-variant-numeric:tabular-nums}
@keyframes zdtd-flash{0%{background:var(--acc-ghost)}100%{background:transparent}}
.stat.flash,tbody tr.flash{animation:zdtd-flash 1.1s ease-out}
@media(prefers-reduced-motion:reduce){.stat.flash,tbody tr.flash{animation:none}.meter i{transition:none}.refresh-ctrl input::after{transition:none}}
</style>
<noscript><style>section[hidden]{display:block}.page-nav,#apm-chart-wrap,.refresh-ctrl,#refresh-now,.glance-band{display:none}</style></noscript>
</head><body>
<!-- zdtd-direction: paper cockpit. THESIS: the operator console is a recompile paper spec sheet with one TMOG terminal pasted to it; it refuses the dark-ops-dashboard default and the tab-buried health answer. OWN-WORLD: warm paper ground, white 10px cards, single green signal, pills carry state words, sans reads / mono is the machine, one dark terminal reserved for the tick chart + console log. STORY: the operator sees whole-server health in the first viewport, reads exact numbers beside every signal, and runs the same admin commands as telnet. FIRST VIEWPORT: glance band (lamp + 4 key stats + tick tape), terminal chart deck beside the job-file record, players ledger below; console aft. FORM: user-pinned mix of tmog/DESIGN_RULES.md and recompile/DESIGN.md; no concept roll. FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md. -->
<a class="skip-link" href="#main-content">Skip to dashboard</a>
<header>
<div class="top"><div class="hdr-left"><span class="mark" aria-hidden="true"></span><h1 class="word">zdtd</h1><span class="ver">__ZDTD_PRODUCT__ · __ZDTD_STOCK_WIRE__ · operator console</span></div>
<span class="glance" role="status" aria-label="Server state"><span class="lamp" id="glance-lamp" aria-hidden="true"></span><span id="glance-word">operational</span></span>
<div class="header-actions">
<label class="refresh-ctrl" for="auto-refresh"><input type="checkbox" id="auto-refresh" checked> auto</label>
<button type="button" class="btn" id="refresh-now" aria-controls="status apm players console settings modules">Refresh</button>
<form class="logout-form" method="post" action="/logout"><input type="hidden" name="csrf" value="__ZDTD_CSRF__"><button type="submit" class="btn">Sign out</button></form>
</div></div>
</header>
<div class="layout">
<nav class="page-nav" role="tablist" aria-label="Dashboard sections" aria-orientation="horizontal">
<button type="button" class="tab" id="tab-status" tabindex="-1" role="tab" aria-selected="false" aria-controls="status-section"><i>01</i> Status</button>
<button type="button" class="tab" id="tab-apm" tabindex="-1" role="tab" aria-selected="false" aria-controls="apm-section"><i>02</i> Performance</button>
