*{box-sizing:border-box}
html{scrollbar-gutter:stable}
body{font-family:var(--sans);margin:0;min-height:100dvh;display:grid;place-items:center;padding:clamp(1rem,4vw,2rem);line-height:1.55;color:var(--fg);background:radial-gradient(720px 460px at 50% 0%, rgba(143,180,255,.08), transparent 62%), linear-gradient(to bottom, var(--bg2) 0%, var(--bg) 100%);-webkit-font-smoothing:antialiased}

.lead{color:var(--muted);font-size:0.875rem;margin:0 0 0.9rem;line-height:1.5}

.secret-row input{flex:1;min-width:0}

input[type=password]:focus,input[type=text]:focus{outline:none;border-color:var(--acc-ring);box-shadow:0 0 0 3px var(--acc-ghost);background:var(--sunken)}
input[aria-invalid=true]{border-color:rgba(251,113,133,.45);box-shadow:0 0 0 3px var(--err-soft)}
button{appearance:none;min-height:42px;min-width:5rem;padding:0.5rem 1rem;border:1px solid transparent;border-radius:10px;background:var(--acc);color:var(--bg);font-weight:700;font-size:0.875rem;cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,.1) inset;transition:filter .12s,transform .05s,opacity .12s}
button:hover{filter:brightness(1.05)}
button:active{transform:translateY(1px)}
.secret-row button{margin-top:0;min-width:4.5rem;background:var(--well);color:var(--fg);border-color:var(--line2);box-shadow:none;font-weight:600;font-size:0.8125rem}
.secret-row button:hover{background:rgba(255,255,255,.05);border-color:var(--edge)}
.secret-row button[aria-pressed=true]{background:var(--acc-soft);border-color:rgba(143,180,255,.22);color:var(--fg)}
.hint{color:var(--muted2);font-size:0.76rem;margin:0.9rem 0 0;line-height:1.5}
.hint + .hint{margin-top:0.4rem}
.err{margin:0 0 0.9rem;padding:0.6rem 0.75rem;border-radius:10px;background:var(--err-soft);border:1px solid rgba(251,113,133,.22);color:#fecdd3;font-size:0.84rem;line-height:1.4}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--acc-ring);outline-offset:2px}
@media(forced-colors:active){:root{--bg:Canvas;--card:Canvas;--well:Canvas;--fg:CanvasText;--muted:GrayText;--acc:LinkText;--edge:ButtonText}body{background:Canvas;color:CanvasText}main{border:1px solid CanvasText}a{color:LinkText}input,button{border:1px solid ButtonText}.err{color:MarkText;background:Mark}}
h1::before{background:var(--warn);box-shadow:0 0 0 4px var(--warn-soft)}
.err{background:var(--warn-soft);border-color:rgba(251,191,36,.22);color:#fde68a}
button:disabled,input:disabled{opacity:.5;cursor:not-allowed}
.retry{color:var(--muted);font-size:0.82rem;margin:0.8rem 0 0}

<body><main><h1>zdtd</h1><p class="meta">webui · sign in</p>
<p id="login-err" class="err" role="alert" tabindex="-1">Too many failed sign-ins. Try again in <span id="retry-seconds" aria-live="off">__ZDTD_RETRY_S__</span> seconds.</p>
<form method="post" action="/login" aria-describedby="login-err">
<label for="login-token">Shared secret</label>
<input type="password" name="token" id="login-token" required maxlength="128" autocomplete="current-password" spellcheck="false" aria-invalid="true" aria-describedby="login-err login-help" disabled>
<button type="submit" disabled>Sign in</button>
</form>
<p><a href="/login">Try signing in again</a>. This page will refresh when the wait is over.</p>
<p id="login-help">Or send <code>Authorization: Bearer …</code> / <code>X-Zdtd-Secret</code>.</p>
<p>Use the secret configured by the server operator with <code>ZDTD_WEBUI_SECRET</code>.</p></main>
<script>
/* zdtd-ts:lockout */
"use strict";
//! Webui lockout page: count down the remaining wait, then reload /login.
//! `__ZDTD_RETRY_S__` is substituted server-side by webui.zig renderTemplate;
//! the compiled JS keeps the reference so the substituted seconds reach the
//! browser. Compiled by scripts/build-webui-ts.sh and injected into
//! login_lockout.html.
const message = document.querySelector('#login-err');
if (message === null) {
    throw new Error('webui: missing element #login-err');
}
const seconds = document.querySelector('#retry-seconds');
if (seconds === null) {
    throw new Error('webui: missing element #retry-seconds');
}
message.focus();
let remaining = __ZDTD_RETRY_S__;
const COUNTDOWN_TICK_MS = 1000;
const countdown = setInterval(() => {
    remaining -= 1;
    seconds.textContent = String(remaining);
    if (remaining <= 0) {
        clearInterval(countdown);
        globalThis.location.replace('/login');
    }
}, COUNTDOWN_TICK_MS);
