<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · zdtd</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>/* zdtd-tokens */
:root{
  color-scheme:light;
  --bg:#f7f5f0;
  --bg2:#efece4;
  --panel:#fffdf8;
  --panel2:#efece4;
  --inset:#efece4;
  --well:#fffdf8;
  --line:#e2ddd0;
  --line2:#cfc8b6;
  --edge:#5f686f;
  --fg:#1a1d21;
  --muted:#4d545c;
  --muted2:#5f686f;
  --acc:#0f5c37;
  --acc-ink:#0c4a2d;
  --acc-soft:#dcefe1;
  --acc-ghost:rgba(15,92,55,.06);
  --acc-ring:rgba(15,92,55,.28);
  --ok:#0f5c37;
  --ok-soft:#dcefe1;
  --warn:#6b4a00;
  --warn-soft:#f2dbaa;
  --err:#8a2318;
  --err-border:#d59f96;
  --err-ink:#3d0d07;
  --err-field:rgba(138,35,24,.45);
  --err-soft:#f5c9c2;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --r:10px;
  --r-ctl:9px;
  --shadow:0 1px 2px rgba(26,29,33,.06),0 8px 24px -12px rgba(26,29,33,.18);
}
/* /zdtd-tokens */
*{box-sizing:border-box}
html{scrollbar-gutter:stable}
body{font-family:var(--sans);margin:0;min-height:100dvh;display:grid;place-items:center;padding:clamp(1rem,4vw,2rem);line-height:1.6;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:var(--acc-ink);text-decoration:underline;text-decoration-color:rgba(15,92,55,.35);text-underline-offset:2px}
a:hover{color:var(--acc-ink)}
code{font-family:var(--mono);font-size:0.82em;background:var(--bg2);border:1px solid var(--line);padding:0.1em 0.32em;border-radius:6px;color:var(--muted)}
main{width:min(26rem,100%);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:1.5rem 1.5rem 1.25rem}
.meta{color:var(--muted);font-family:var(--sans);font-size:0.78rem;letter-spacing:0.05em;text-transform:uppercase;font-weight:600;margin:0.2rem 0 1rem}
.lead{color:var(--muted);font-size:1rem;margin:0 0 1rem;line-height:1.6}
label{display:block;font-family:var(--sans);font-size:0.9rem;font-weight:600;color:var(--fg);margin:1.1rem 0 0.45rem}
.secret-row{display:flex;align-items:stretch;gap:0.35rem}
.secret-row input{flex:1;min-width:0}
input[type=password],input[type=text]{width:100%;box-sizing:border-box;min-height:44px;padding:0.65rem 0.8rem;border:1.5px solid var(--line2);border-radius:var(--r-ctl);background:var(--well);color:var(--fg);font-family:var(--mono);font-size:0.95rem}
input[type=password]:focus,input[type=text]:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
input[aria-invalid=true]{border-color:var(--err-field);box-shadow:0 0 0 2px var(--err-soft)}
button{appearance:none;min-height:44px;min-width:5rem;padding:0.7rem 1.25rem;border:1px solid var(--acc-ink);border-radius:var(--r-ctl);background:var(--acc);color:#fff;font-family:var(--sans);font-weight:600;font-size:0.9rem;cursor:pointer}
button:hover{background:var(--acc-ink)}
button:active{transform:translateY(1px)}
.secret-row button{margin-top:0;min-width:3.8rem;min-height:44px;background:transparent;color:var(--muted);border:1px solid var(--line2);border-radius:var(--r-ctl);font-weight:600;font-size:0.85rem;font-family:var(--sans)}
.secret-row button:hover{color:var(--fg);border-color:var(--edge);background:var(--bg2)}
.secret-row button[aria-pressed=true]{background:var(--acc-soft);border-color:var(--edge);color:var(--fg)}
.hint{color:var(--muted);font-size:0.85rem;margin:0.75rem 0 0;line-height:1.6}
.hint + .hint{margin-top:0.25rem}
.err{margin:0 0 0.85rem;padding:0.9rem 1rem;border-radius:var(--r);background:var(--err-soft);border:1px solid var(--err-border);color:var(--err-ink);font-family:var(--sans);font-size:0.9rem;line-height:1.5}
button:disabled{opacity:.45;cursor:not-allowed}
#retry-seconds{font-variant-numeric:tabular-nums;font-weight:700;color:var(--fg)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.brand{margin:0;font-family:var(--sans);font-size:1.35rem;font-weight:700;letter-spacing:-0.02em;color:var(--fg)}
.signin{margin-top:0.65rem;width:100%}
@media(forced-colors:active){:root{--bg:Canvas;--panel:Canvas;--well:Canvas;--fg:CanvasText;--muted:CanvasText;--acc:LinkText}body{background:Canvas;color:CanvasText}main{border:1px solid CanvasText}a{color:LinkText}input,button{border:1px solid ButtonText}.err{color:MarkText;background:Mark}}
</style></head>
<body><main><p class="brand">zdtd</p><p class="meta">operator console · sign in</p>
<p id="login-err" class="err" role="alert" tabindex="-1">Too many failed sign-ins. Try again in <span id="retry-seconds" aria-live="off">__ZDTD_RETRY_S__</span> seconds.</p>
<form method="post" action="/login" aria-describedby="login-err">
<label for="login-token">Shared secret</label>
<input type="password" name="token" id="login-token" required maxlength="128" autocomplete="current-password" spellcheck="false" aria-invalid="true" aria-describedby="login-err login-help" disabled>
<button type="submit" disabled>Sign in</button>
</form>
<p class="hint"><a href="/login">Try signing in again</a>. This page will refresh when the wait is over.</p>
<p id="login-help" class="hint">Or send <code>Authorization: Bearer …</code> / <code>X-Zdtd-Secret</code>.</p>
<p class="hint">Secret is set by the operator via <code>ZDTD_WEBUI_SECRET</code>.</p></main><script>
/* zdtd-ts:lockout */
"use strict";
//! Webui lockout page: count down the remaining wait, then reload /login.
//! `__ZDTD_RETRY_S__` is substituted server-side by webui.zig renderTemplate;
//! the compiled JS keeps the reference so the substituted seconds reach the
//! browser. Compiled by scripts/build-webui-ts.sh and injected into
//! login_lockout.html.
const message = document.querySelector('#login-err');
if (message === null) {
    throw new Error('webui: missing element #login-err');
}
const seconds = document.querySelector('#retry-seconds');
if (seconds === null) {
    throw new Error('webui: missing element #retry-seconds');
}
message.focus();
let remaining = __ZDTD_RETRY_S__;
const COUNTDOWN_TICK_MS = 1000;
const countdown = setInterval(() => {
    remaining -= 1;
    seconds.textContent = String(remaining);
    if (remaining <= 0) {
        clearInterval(countdown);
        globalThis.location.replace('/login');
    }
}, COUNTDOWN_TICK_MS);
/* /zdtd-ts:lockout */
</script></body></html>
